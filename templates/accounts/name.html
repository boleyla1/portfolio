{% extends 'base.html' %}
{% block name %}
<!DOCTYPE html>
<html lang="fa">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورودی نام و نام خانوادگی</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f0f0f0;
            margin: 0;
        }
        .form-container {
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            width: 300px;
            text-align: center;
        }
        .form-container h2 {
            margin-bottom: 20px;
            font-size: 1.5em;
            color: #333333;
        }
        .form-container input {
            width: calc(100% - 20px);
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #dddddd;
            border-radius: 5px;
            font-size: 1em;
        }
        .form-container input:focus {
            border-color: #007bff;
            outline: none;
        }
        .form-container button {
            width: calc(100% - 20px);
            padding: 10px;
            background-color: #007bff;
            border: none;
            border-radius: 5px;
            color: #ffffff;
            font-size: 1em;
            cursor: pointer;
            margin-top: 20px;
        }
        .form-container button:hover {
            background-color: #0056b3;
        }
        @media (min-width: 768px) {
    .form-container {
        height: 51%;
        width: 101%;
    }
}

/* تنظیمات برای حالت موبایل */
@media (max-width: 767px) {
    .form-container {
        height: 103%;
        width: 100%;
    }
}

    </style>
</head>
<body>
    <div class="form-container">
        <h2>اطلاعات خود را وارد کنید</h2>
        <form method="post" action="{% url 'nameuser' %}">
            {% csrf_token %}
            <input type="text" name="first_name" placeholder="نام" required>
            <input type="text" name="last_name" placeholder="نام خانوادگی" required>
            <button type="submit">ثبت نام</button>
        </form>
    </div>
</body>
</html>
{% endblock %}
